name: CI Pipeline for Selenium Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "6.0.x"

      - name: Setup Chocolatey
        run: |
          powershell -Command "Set-ExecutionPolicy Bypass -Scope CurrentUser -Force; iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))"

      - name: Install Edge WebDriver
        run: |
          try {
            $version = (Invoke-WebRequest -Uri "https://msedgedriver.azureedge.net/LATEST_RELEASE" -UseBasicParsing -ErrorAction Stop).Content.Trim()
            Write-Host "Latest version: $version"
          } catch {
            Write-Host "Failed to get latest version, using fallback version 123.0.2420.53"
            $version = "123.0.2420.53"
          }
          Invoke-WebRequest -Uri "https://msedgedriver.azureedge.net/$version/edgedriver_win64.zip" -OutFile "edgedriver.zip" -ErrorAction Stop
          Expand-Archive -Path "edgedriver.zip" -DestinationPath "$env:LOCALAPPDATA" -Force
          $env:Path += ";$env:LOCALAPPDATA"
        shell: powershell

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --logger "trx" --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: ./TestResults/

      - name: Archive ExtentReports
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: extent-reports
          path: ./Reports/
