name: CI Pipeline for Selenium Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "6.0.x"

      - name: Setup Chocolatey
        run: |
          powershell -Command "Set-ExecutionPolicy Bypass -Scope CurrentUser -Force; iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))"

      - name: Add EdgeDriver to PATH
        run: |
          $env:Path += ";$PWD/tools/edgedriver"
          Write-Host "Added EdgeDriver to PATH"
        shell: powershell

      - name: Restore dependencies
        run: dotnet restore ProjectSlenium/ProjectSlenium.csproj

      - name: Build
        run: dotnet build ProjectSlenium/ProjectSlenium.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ProjectSlenium/ProjectSlenium.csproj --configuration Release --no-build --logger "trx" --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: ./TestResults/

      - name: Archive ExtentReports
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: extent-reports
          path: ./ProjectSlenium/bin/Debug/Reports/

      - name: Prepare latest report for GitHub Pages
        if: github.ref == 'refs/heads/master'
        shell: bash
        run: |
          mkdir -p site
          REPORT_DIR="./ProjectSlenium/bin/Debug/Reports"
          LATEST_REPORT=$(ls -t "$REPORT_DIR"/*.html | head -n 1)
          echo "📄 Latest report: $LATEST_REPORT"
          cp "$LATEST_REPORT" site/index.html

      - name: Deploy report to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
